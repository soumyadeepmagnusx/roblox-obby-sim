name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Verify JavaScript Syntax
      run: |
        for file in *.js; do
          echo "Checking $file..."
          node --check "$file"
        done
        npm test

    - name: Test Server Initialization & Healthcheck
      run: |
        node server.js > /tmp/server.log 2>&1 &
        SERVER_PID=$!
        trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

        READY=0
        for i in $(seq 1 15); do
          if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
            READY=1
            break
          fi
          sleep 1
        done

        if [ "$READY" -ne 1 ]; then
          echo "Server failed healthcheck. Logs:"
          cat /tmp/server.log || true
          exit 1
        fi

        echo "Server healthcheck passed (HTTP 200 on port 8080)."
